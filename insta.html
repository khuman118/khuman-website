<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram - Khuman</title>

<link rel="icon" type="image/png" href="logo.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;

    background:
    linear-gradient(
        rgba(0,0,0,.70),
        rgba(0,0,0,.84)
    ),
    url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2000&q=90");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}


/* NAVBAR */

nav{
    position:sticky;
    top:0;
    z-index:100;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:14px 7%;

    background:rgba(0,0,0,.75);
    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(255,255,255,.15);
}


/* KHUMAN LOGO */

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    font-size:22px;
    font-weight:bold;
}

.logo img{
    width:45px;
    height:45px;

    border-radius:50%;
    object-fit:cover;

    border:2px solid #ffd700;

    box-shadow:
    0 0 15px rgba(255,215,0,.5);
}

.logo span{
    background:
    linear-gradient(
        90deg,
        #ffffff,
        #ffd700
    );

    -webkit-background-clip:text;
    color:transparent;
}


/* MENU */

.menu{
    display:flex;
    gap:25px;
}

.menu a{
    color:white;
    text-decoration:none;
    font-weight:bold;

    transition:.3s;
}

.menu a:hover{
    color:#ffd700;
}


/* MAIN */

.container{
    min-height:calc(100vh - 75px);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:45px 20px;
}


/* INSTAGRAM BOX */

.insta-box{
    width:100%;
    max-width:700px;

    padding:55px 30px;

    text-align:center;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.20);

    border-radius:25px;

    backdrop-filter:blur(15px);

    box-shadow:
    0 20px 60px rgba(0,0,0,.5);
}


/* REALISTIC INSTAGRAM ICON */

.insta-icon{
    width:115px;
    height:115px;

    margin:0 auto 28px;

    border-radius:30px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        145deg,
        #5b1aa8 0%,
        #833ab4 25%,
        #e1306c 55%,
        #fd1d1d 75%,
        #fcb045 100%
    );

    border:2px solid rgba(255,255,255,.35);

    box-shadow:
    inset 0 2px 5px rgba(255,255,255,.35),
    inset 0 -8px 15px rgba(0,0,0,.25),
    0 12px 25px rgba(0,0,0,.55),
    0 0 35px rgba(225,48,108,.35);

    position:relative;

    overflow:hidden;
}


/* ICON SHINE */

.insta-icon::before{
    content:"";

    position:absolute;

    width:150px;
    height:45px;

    top:5px;
    left:-20px;

    background:rgba(255,255,255,.22);

    transform:rotate(-25deg);

    filter:blur(2px);

    border-radius:50%;
}


/* INSTAGRAM LOGO */

.insta-icon svg{
    width:68px;
    height:68px;

    position:relative;
    z-index:2;

    filter:
    drop-shadow(0 3px 4px rgba(0,0,0,.45));
}


/* HEADING */

h1{
    font-size:clamp(42px,8vw,65px);

    margin-bottom:15px;

    background:
    linear-gradient(
        90deg,
        #ffffff,
        #ffd700
    );

    -webkit-background-clip:text;
    color:transparent;
}


/* TEXT */

.subtitle{
    font-size:20px;
    color:#ddd;
    margin-bottom:15px;
}

.username{
    font-size:25px;
    font-weight:bold;
    color:#ffd700;
    margin-bottom:20px;
}

.description{
    max-width:600px;

    margin:auto;

    color:#ccc;

    font-size:17px;

    line-height:1.8;
}


/* FOLLOW BUTTON */

.btn{
    display:inline-block;

    margin-top:35px;

    padding:16px 35px;

    color:white;

    text-decoration:none;

    font-weight:bold;

    font-size:18px;

    border-radius:35px;

    background:
    linear-gradient(
        90deg,
        #833ab4,
        #fd1d1d,
        #fcb045
    );

    box-shadow:
    0 8px 20px rgba(0,0,0,.35);

    transition:.3s;
}

.btn:hover{
    transform:translateY(-4px);

    box-shadow:
    0 10px 30px rgba(255,100,50,.4);
}


/* BACK BUTTON */

.back{
    display:inline-block;

    margin-top:18px;

    color:#ccc;

    text-decoration:none;

    font-size:15px;

    transition:.3s;
}

.back:hover{
    color:#ffd700;
}


/* FOOTER */

footer{
    text-align:center;

    padding:30px 15px;

    color:#aaa;

    background:rgba(0,0,0,.65);

    border-top:
    1px solid rgba(255,255,255,.1);
}


/* MOBILE */

@media(max-width:700px){

    nav{
        padding:12px 5%;
    }

    .logo{
        font-size:18px;
    }

    .logo img{
        width:38px;
        height:38px;
    }

    .menu{
        gap:12px;
    }

    .menu a{
        font-size:13px;
    }

    .insta-box{
        padding:45px 20px;
    }

    .insta-icon{
        width:100px;
        height:100px;
        border-radius:27px;
    }

    .insta-icon svg{
        width:60px;
        height:60px;
    }

    .subtitle{
        font-size:18px;
    }

    .description{
        font-size:16px;
    }

}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav>

    <div class="logo">

        <img src="logo.png" alt="Khuman Logo">

        <span>👑 Khuman</span>

    </div>


    <div class="menu">

        <a href="index.html">Home</a>

        <a href="about.html">About</a>

        <a href="insta.html">Instagram</a>

    </div>

</nav>



<!-- INSTAGRAM PAGE -->

<div class="container">

    <div class="insta-box">


        <!-- REALISTIC INSTAGRAM LOGO -->

        <div class="insta-icon">

            <svg
                viewBox="0 0 24 24"
                aria-label="Instagram logo"
            >

                <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="5"
                    fill="none"
                    stroke="white"
                    stroke-width="2"
                />

                <circle
                    cx="12"
                    cy="12"
                    r="4"
                    fill="none"
                    stroke="white"
                    stroke-width="2"
                />

                <circle
                    cx="17.5"
                    cy="6.5"
                    r="1.2"
                    fill="white"
                />

            </svg>

        </div>


        <h1>
            Instagram
        </h1>


        <p class="subtitle">
            Follow my journey on Instagram
        </p>


        <p class="username">
            @official.khuman_9
        </p>


        <p class="description">

            Follow me on Instagram to stay connected
            and see my latest updates, interests,
            learning journey and more. 🚀

        </p>


        <a
            href="https://www.instagram.com/official.khuman_9/"
            target="_blank"
            class="btn"
        >
            Instagram • Follow Me
        </a>


        <br>


        <a
            href="index.html"
            class="back"
        >
            ← Back to Home
        </a>


    </div>

</div>



<!-- FOOTER -->

<footer>

    © 2026 Khuman. All Rights Reserved.

</footer>


</body>
</html>
